## INPUT FIELDS

Mandatory (always present):
- Skill Name: {{skill_name}}
- Core Function: {{core_function}}
- Goals & Objectives: {{goals}}

Optional (may be empty, blank, "N/A", "none", or "TBD" — treat ALL of these as NOT PROVIDED):
- Tone & Voice: {{tone_voice}}
- Workflow Steps: {{workflow_steps}}
- Constraints & Safety: {{constraints}}
- Example Interactions: {{examples}}
- Output Types: {{output_types}}

---

## NULL FIELD RULE (apply before anything else)

If an optional field is empty, whitespace-only, "N/A", "none", "TBD", or a dash — it is NULL.
NULL field = omit that section entirely from the SKILL.md. Never invent content for NULL fields.
Exception: Workflow. If Workflow Steps is NULL, DERIVE steps from Core Function + Goals (see Workflow rules below).

---

## OUTPUT FORMAT

Produce raw SKILL.md only.
- Start with `---` (YAML frontmatter open)
- End with last line of content
- No preamble, no explanation, no markdown fences wrapping the whole output
- No HTML comments in the final file

After the SKILL.md content, on a NEW LINE output this metadata block ONLY (for the builder UI, not part of the skill file):
<!--BUILDER_META complexity: simple|moderate|complex suggest_references: true|false reason: string -->

---

## SECTION-BY-SECTION RULES

### YAML Frontmatter (always required)

name: {{skill_name | kebab-case | lowercase}}
description: >
  [TRIGGER-FIRST paragraph. Max 80 words. Rules:
   1. Lead with what the skill DOES (verb-first: "Generates...", "Analyzes...", "Converts...")
   2. Follow with WHEN TO TRIGGER: list specific user phrases, task types, keywords, contexts
   3. Be slightly pushy — Claude undertriggers by default, so list edge cases that should still fire this skill
   4. All "when to use" info lives HERE only, never in the body

   WEAK (don't do): "A skill for helping with data analysis tasks."
   STRONG (do): "Performs structured data analysis on CSVs, spreadsheets, and raw datasets.
   Trigger whenever user asks to analyze, clean, summarize, chart, or find patterns in data —
   even if they don't say 'analyze', e.g. 'what's wrong with my spreadsheet', 'summarize
   these numbers', 'why is revenue dropping'."]
compatibility: [only include if skill needs specific tools/MCPs/deps — otherwise DELETE this line entirely]

### Title + Overview (always required)
- H1 = Skill Name in Title Case
- 1-2 sentences: plain-English what + who benefits. No fluff.

### Goals (always required)
- Derive directly from Goals & Objectives field
- Bullet list, action-oriented ("Enable X", "Produce Y", "Ensure Z")
- 2-4 bullets max

### Tone & Voice (only if field NOT NULL)
- 2-4 bullets reflecting the style
- If field IS NULL → omit section entirely, no placeholder

### Workflow (always required — derive if NULL)
RULES:
- If Workflow Steps provided → clean, number, convert to imperative verbs
- If Workflow Steps NULL → infer sensible 4-6 steps from Core Function + Goals alone
- Format: `N. **Step title** — what to do and why (one line)`
- 4-8 steps ideal, hard max 10
- If any provided step conflicts with a Constraint → Constraint wins; rewrite the step to comply, do not silently drop it

### Constraints & Safety (only if field NOT NULL, OR domain clearly implies critical rules)

### Examples (only if field NOT NULL)
- Max 2 examples

### Output Types (only if field NOT NULL)
- Bullet list of artifact/output types</script>

var urlIn=document.getElementById('url');
var keyIn=document.getElementById('key');
var keyField=document.getElementById('keyField');
var modelSel=document.getElementById('model');
var modelWrap=document.getElementById('modelWrap');
var modelHint=document.getElementById('modelHint');
var urlHint=document.getElementById('urlHint');
var saveBtn=document.getElementById('saveBtn');
var status=document.getElementById('status');
function showStatus(msg,type){status.textContent=msg;status.className='status '+(type||'info')}
providerSel.addEventListener('change',function(){
  var p=PROVIDERS[this.value];if(!p)return;
  urlIn.value=p.url;urlHint.textContent=p.hint||'';
  keyField.style.display=p.needsKey?'block':'none';
  if(!p.needsKey)keyIn.value='';
  resetModelDropdown();
  showStatus('Provider set — paste your key then load models','info');
});
function resetModelDropdown(){modelSel.innerHTML='<option value="">— Click to load models —</option>';modelHint.textContent='Click the dropdown to fetch available models'}
var modelsFetched=false;
var modelsFetching=false;
modelSel.addEventListener('mousedown',async function(e){
  if(modelsFetching)return;
  var hasRealOptions=modelSel.options.length>1&&modelSel.options[1].value!=='__error__';
  if(hasRealOptions)return;
  var base=urlIn.value.trim();
  if(!base){showStatus('Enter Base URL first','err');e.preventDefault();return}
  e.preventDefault();await fetchModels();setTimeout(function(){modelSel.focus();},50);
});
async function fetchModels(){
  if(modelsFetching)return;
  modelsFetching=true;modelWrap.classList.add('loading');
  modelHint.textContent='Fetching models…';showStatus('Loading models…','info');
  var providerKey=providerSel.value||'custom';
  var p=PROVIDERS[providerKey]||PROVIDERS.custom;
  var baseUrl=urlIn.value.trim().replace(/\/+$/,'');
  var apiKey=keyIn.value.trim();
  var endpoint=baseUrl+p.modelsEndpoint;
  var headers={'Content-Type':'application/json',...(p.extraHeaders||{}),...p.authHeader(apiKey)};
  try{
    var res=await fetch(endpoint,{method:'GET',headers,signal:AbortSignal.timeout(15000)});
    if(!res.ok){var errBody=await res.json().catch(()=>({error:{message:'HTTP '+res.status}}));throw new Error((errBody.error&&errBody.error.message)||'HTTP '+res.status)}
    var data=await res.json();
    var models=p.modelsAdapter(data);
    if(!models||models.length===0)throw new Error('No models returned');
    var savedModel=getSavedModel();
    modelSel.innerHTML='';
    models.forEach(function(id){var opt=document.createElement('option');opt.value=id;opt.textContent=id;if(id===savedModel)opt.selected=true;modelSel.appendChild(opt)});
    modelHint.textContent=models.length+' models loaded';
    showStatus('✓ '+models.length+' models loaded','ok');
    modelsFetched=true;
  }catch(err){
    modelSel.innerHTML='<option value="__error__">Failed to load — type model name manually</option>';
    addManualModelInput();
    modelHint.textContent='Could not fetch: '+err.message;
    showStatus('Model fetch failed: '+err.message,'err');
  }finally{modelWrap.classList.remove('loading');modelsFetching=false}
}
function addManualModelInput(){
  var wrap=document.getElementById('modelWrap');
  var existing=document.getElementById('modelManual');
  if(existing)return;
  var inp=document.createElement('input');
  inp.type='text';inp.id='modelManual';inp.placeholder='Type model name manually (e.g. gpt-4o)';
  inp.style.cssText='width:100%;padding:12px 14px;font-family:Georgia,serif;font-size:0.88rem;color:#2C2318;background:rgba(255,253,248,0.85);border:1px solid rgba(200,185,165,0.35);border-radius:10px;outline:none;margin-top:8px;box-sizing:border-box';
  wrap.appendChild(inp);
  var saved=getSavedModel();if(saved)inp.value=saved;
}
function getModelValue(){
  var manual=document.getElementById('modelManual');
  if(manual&&manual.value.trim())return manual.value.trim();
  return modelSel.value&&modelSel.value!=='__error__'?modelSel.value:'';
}
function getSavedModel(){
  try{return JSON.parse(localStorage.getItem('claude-skill-config')||'{}').MODEL_NAME||''}catch(e){return''}
}
saveBtn.addEventListener('click',function(){
  var url=urlIn.value.trim();var key=keyIn.value.trim();var model=getModelValue();
  if(!url){showStatus('Base URL is required','err');return}
  if(!model){showStatus('Select or type a model name','err');return}
  var providerKey=providerSel.value||'custom';
  var p=PROVIDERS[providerKey];
  if(p&&p.needsKey&&!key){showStatus('API Key is required for this provider','err');return}
  try{
    localStorage.setItem('claude-skill-config',JSON.stringify({BASE_URL:url,API_KEY:key,MODEL_NAME:model}));
    showStatus('✓ Saved! Config is ready.','ok');
  }catch(e){showStatus('Failed to save: '+e.message,'err')}
});
function loadConfig(){
  try{
    var cfg=JSON.parse(localStorage.getItem('claude-skill-config')||'{}');
    if(cfg.BASE_URL){
      urlIn.value=cfg.BASE_URL;
      var matched='custom';
      Object.entries(PROVIDERS).forEach(function(e){if(e[1].url&&cfg.BASE_URL.startsWith(e[1].url))matched=e[0]});
      providerSel.value=matched;
      var p=PROVIDERS[matched];
      if(p){urlHint.textContent=p.hint||'';keyField.style.display=p.needsKey?'block':'none'}
    }
    if(cfg.API_KEY)keyIn.value=cfg.API_KEY;
    if(cfg.MODEL_NAME){
      modelSel.innerHTML='';
      var opt=document.createElement('option');opt.value=cfg.MODEL_NAME;opt.textContent=cfg.MODEL_NAME;opt.selected=true;modelSel.appendChild(opt);
      var refetch=document.createElement('option');refetch.value='__reload__';refetch.textContent='↻ Click to reload full model list';modelSel.appendChild(refetch);
      modelHint.textContent='Showing saved model. Click dropdown to reload full list.';
    }
    if(cfg.BASE_URL||cfg.API_KEY||cfg.MODEL_NAME)showStatus('Configuration loaded','ok');
  }catch(e){}
}
modelSel.addEventListener('change',function(){
  if(this.value==='__reload__'){modelsFetched=false;resetModelDropdown();fetchModels()}
});
loadConfig();
})();
function openConfigModal(){document.getElementById('configModal').style.display='flex'}
function closeConfigModal(){document.getElementById('configModal').style.display='none'}
</script>
</body>
</html>
